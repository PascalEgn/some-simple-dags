<source>
  @type tail
  path /opt/airflow/logs/**/*.log
  pos_file /fluentd/pos/airflow.pos
  tag airflow.logs
  path_key log_path
  <parse>
    @type json
  </parse>
</source> 

# Extract DAG info from log_path
<filter airflow.logs>
  @type record_transformer
  enable_ruby true
  <record>
    dag_id  ${ record["key"] && record["value"] ? record["key"].include?("dag_id") ? record["value"][record["key"].index("dag_id")] : nil : nil }
    version ${ record["key"] && record["value"] ? record["key"].include?("version") ? record["value"][record["key"].index("version")] : nil : nil }
    tags    ${ record["key"] && record["value"] ? record["key"].include?("tags") ? record["value"][record["key"].index("tags")] : nil : nil }
    run_id  ${ record["key"] && record["value"] ? record["key"].include?("run_id") ? record["value"][record["key"].index("run_id")] : nil : nil }
  </record>
  remove_keys key,value
</filter>

# Parse DAG Metadata from event
<filter airflow.logs>
  @type parser
  key_name event
  reserve_data true
  <parse>
    @type regexp
    expression /^DAG Metadata(?:(?:\s*\|\s*(?<key>\w+)=(?<value>(?:\[[^\]]*\]|[^|]+)))+)\s*\|?$/
    time_type string
  </parse>
  emit_invalid_record_to_error false
</filter>

# Expand DAG Metadata fields, assign only if non-nil
<filter airflow.logs>
  @type record_transformer
  enable_ruby true
  <record>
    ${record["key"] && record["value"] ? Hash[record["key"].zip(record["value"])].each { |k,v| record[k] = v if v && !v.empty? } : nil }
  </record>
  remove_keys key,value
</filter>

# Output to stdout for testing
<match airflow.logs>
  @type opensearch
  host "#{ENV['OPENSEARCH__HOST']}"
  port "#{ENV['OPENSEARCH__PORT']}"
  scheme https
  path "#{ENV['OPENSEARCH_CONFIGS__URL_PREFIX']}"
  user "#{ENV['OPENSEARCH__USERNAME']}"
  password "#{ENV['OPENSEARCH__PASSWORD']}"
  index_name "#{ENV['OPENSEARCH__INDEX_NAME']}"
  ssl_verify false
  type_name _doc

  <buffer>
    @type file
    path /fluentd/buffer
  </buffer>
</match>
